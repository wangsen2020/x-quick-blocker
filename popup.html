<!doctype html><meta charset="utf-8">
<style>
 body{width:260px;margin:0;padding:14px;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#16181c;color:#e7e9ea}
 h1{font-size:14px;margin:0 0 10px}
 label{display:flex;align-items:center;gap:8px;padding:5px 0}
 p{color:#71767b;font-size:12px;margin:10px 0 0}
 a{color:#1d9bf0}
</style>
<h1>X Quick Blocker</h1>
<label><input type="checkbox" id="enabled"> <span data-i18n="optEnabled">Enable extension</span></label>
<label><input type="checkbox" id="showInlineButton"> <span data-i18n="optInlineButton">Show block icon on posts</span></label>
<label><input type="checkbox" id="scanEnabled"> <span data-i18n="optScan">Enable keyword scanning</span></label>
<label><input type="checkbox" id="autoBlock"> <span data-i18n="optAuto">Fully automatic (block on match, no confirmation) ⚠️</span></label>
<p data-i18n="popupNote">Filters, allowlist and throttling live in the 🛡 panel at the bottom right of x.com.</p>
<script src="popup.js"></script>
