<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">X Quick Blocker 核心功能</title>
  <desc id="desc">四张功能卡展示一键屏蔽、关键词筛选、节流退避与可撤销日志。</desc>
  <rect width="1280" height="660" fill="#0b1116"/>
  <path d="M0 0H1280V660H0Z" fill="url(#grid)" opacity=".28"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="78" fill="#f5f9fb" font-size="34" font-weight="800" letter-spacing="-1">从时间线到可控操作</text>
    <text x="72" y="110" fill="#91a8b6" font-size="17">只保留需要的内容；每一步都在浏览器本地完成。</text>
    <path d="M777 80h359" stroke="#24526a" stroke-width="2"/>
    <circle cx="1152" cy="80" r="6" fill="#20b8e5"/>
    <g transform="translate(72 158)">
      <rect width="548" height="210" rx="18" fill="#101c25" stroke="#29475a"/>
      <rect x="24" y="26" width="52" height="52" rx="14" fill="#123142"/>
      <path d="M42 42h17m-17 8h22m-22 8h14" stroke="#20b8e5" stroke-width="3" stroke-linecap="round"/>
      <text x="94" y="50" fill="#f5f9fb" font-size="22" font-weight="750">一键屏蔽</text>
      <text x="94" y="77" fill="#9fb4c0" font-size="15">推文操作栏新增快捷图标</text>
      <g transform="translate(24 104)">
        <rect width="500" height="76" rx="11" fill="#0b1116" stroke="#213d4e"/>
        <circle cx="38" cy="38" r="19" fill="#29475a"/>
        <rect x="72" y="22" width="128" height="9" rx="4.5" fill="#d9e6ee" opacity=".82"/>
        <rect x="72" y="42" width="218" height="7" rx="3.5" fill="#6f8797" opacity=".5"/>
        <path d="M335 38h70" stroke="#3d6477" stroke-width="2" stroke-dasharray="5 5"/>
        <path d="M400 32l11 6-11 6" fill="#20b8e5"/>
        <rect x="428" y="18" width="48" height="40" rx="10" fill="#20b8e5"/>
        <path d="M442 28l20 20m0-20l-20 20" stroke="#071116" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(660 158)">
      <rect width="548" height="210" rx="18" fill="#101c25" stroke="#29475a"/>
      <rect x="24" y="26" width="52" height="52" rx="14" fill="#123142"/>
      <circle cx="47" cy="48" r="11" fill="none" stroke="#20b8e5" stroke-width="3"/><path d="M55 56l10 10" stroke="#20b8e5" stroke-width="3" stroke-linecap="round"/>
      <text x="94" y="50" fill="#f5f9fb" font-size="22" font-weight="750">关键词筛选</text>
      <text x="94" y="77" fill="#9fb4c0" font-size="15">支持关键词和正则，命中进入候选列表</text>
      <g transform="translate(24 104)">
        <rect width="206" height="76" rx="11" fill="#0b1116" stroke="#213d4e"/>
        <text x="17" y="25" fill="#7892a1" font-size="12">FILTERS</text>
        <rect x="17" y="37" width="92" height="24" rx="12" fill="#153a4c"/><text x="30" y="54" fill="#8cddf1" font-size="12">keyword</text>
        <rect x="116" y="37" width="68" height="24" rx="12" fill="#193044"/><text x="129" y="54" fill="#b8ccda" font-size="12">regex</text>
        <path d="M254 38h64" stroke="#3d6477" stroke-width="2"/><path d="M313 32l11 6-11 6" fill="#20b8e5"/>
        <rect x="342" width="158" height="76" rx="11" fill="#0b1116" stroke="#20b8e5"/>
        <text x="359" y="25" fill="#7892a1" font-size="12">CANDIDATES</text>
        <circle cx="368" cy="47" r="7" fill="#20b8e5"/><rect x="383" y="42" width="72" height="8" rx="4" fill="#d9e6ee" opacity=".8"/>
        <circle cx="368" cy="63" r="7" fill="#20b8e5" opacity=".55"/><rect x="383" y="58" width="54" height="8" rx="4" fill="#9eb4c0" opacity=".55"/>
      </g>
    </g>
    <g transform="translate(72 400)">
      <rect width="548" height="210" rx="18" fill="#101c25" stroke="#29475a"/>
      <rect x="24" y="26" width="52" height="52" rx="14" fill="#123142"/>
      <path d="M50 35v14l10 7" fill="none" stroke="#20b8e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="50" r="16" fill="none" stroke="#20b8e5" stroke-width="3"/>
      <text x="94" y="50" fill="#f5f9fb" font-size="22" font-weight="750">节流与退避</text>
      <text x="94" y="77" fill="#9fb4c0" font-size="15">逐个执行，支持间隔、上限与 429 自动退避</text>
      <g transform="translate(24 117)">
        <circle cx="20" cy="20" r="16" fill="#20b8e5"/><text x="15" y="25" fill="#071116" font-size="13" font-weight="800">1</text><path d="M42 20h88" stroke="#20b8e5" stroke-width="2" stroke-dasharray="4 5"/>
        <circle cx="150" cy="20" r="16" fill="#20b8e5" opacity=".72"/><text x="145" y="25" fill="#071116" font-size="13" font-weight="800">2</text><path d="M172 20h88" stroke="#20b8e5" stroke-width="2" stroke-dasharray="4 5"/>
        <circle cx="280" cy="20" r="16" fill="#20b8e5" opacity=".5"/><text x="275" y="25" fill="#071116" font-size="13" font-weight="800">3</text>
        <rect x="328" y="3" width="167" height="34" rx="17" fill="#153a4c"/><text x="347" y="25" fill="#9ee7f7" font-size="13" font-weight="700">429 → backoff → retry</text>
      </g>
    </g>
    <g transform="translate(660 400)">
      <rect width="548" height="210" rx="18" fill="#101c25" stroke="#29475a"/>
      <rect x="24" y="26" width="52" height="52" rx="14" fill="#123142"/>
      <path d="M39 44h19a10 10 0 1 1-3 19" fill="none" stroke="#20b8e5" stroke-width="3" stroke-linecap="round"/><path d="M39 44l6-7m-6 7l7 5" fill="none" stroke="#20b8e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="94" y="50" fill="#f5f9fb" font-size="22" font-weight="750">确认、记录、撤销</text>
      <text x="94" y="77" fill="#9fb4c0" font-size="15">默认确认后批量操作；日志保留结果并可解除屏蔽</text>
      <g transform="translate(24 104)">
        <rect width="500" height="76" rx="11" fill="#0b1116" stroke="#213d4e"/>
        <rect x="16" y="16" width="24" height="24" rx="6" fill="#20b8e5"/><path d="M23 28l4 4 7-9" fill="none" stroke="#071116" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="54" y="21" width="116" height="8" rx="4" fill="#d9e6ee" opacity=".82"/><rect x="54" y="38" width="72" height="6" rx="3" fill="#708a99" opacity=".6"/>
        <path d="M201 38h67" stroke="#3d6477" stroke-width="2"/><path d="M263 32l11 6-11 6" fill="#20b8e5"/>
        <rect x="298" y="18" width="168" height="40" rx="10" fill="#153a4c" stroke="#28647d"/><path d="M319 32h17a9 9 0 1 1-3 16" fill="none" stroke="#8cddf1" stroke-width="2"/><text x="350" y="43" fill="#d8f2f8" font-size="14" font-weight="700">解除屏蔽</text>
      </g>
    </g>
  </g>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#315063" stroke-width="1"/></pattern></defs>
</svg>
